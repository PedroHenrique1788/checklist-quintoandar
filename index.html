<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Checklist de Atendimento - Pay</title>
  <style>
    body {
      font-family: Poppins, sans-serif;
      margin: 0;
      padding: 30px;
      background-color: #1E3A8A;
      color: #fff;
    }
    h1 {
      text-align: center;
      color: #E0E7FF;
      margin-bottom: 20px;
    }
    .checklist, .form {
      max-width: 700px;
      margin: auto;
    }
    .item {
      background: #fff;
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
      color: #333;
    }
    .button-container {
      text-align: center;
      margin-top: 20px;
    }
    button {
      background-color: #60A5FA;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background-color: #3B82F6;
    }
    label {
      display: block;
      margin-bottom: 10px;
    }
    input[type="text"] {
      padding: 10px;
      width: 100%;
      border-radius: 6px;
      border: 1px solid #ccc;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>
  <h1>Checklist Pay - Chat</h1>

  <div class="form">
    <label for="analista">Nome do Analista:</label>
    <input type="text" id="analista" placeholder="Digite seu nome">

    <label for="ticket">Ticket de Atendimento:</label>
    <input type="text" id="ticket" placeholder="Digite o número do ticket">
  </div>

  <div class="checklist" id="checklist"></div>

  <div class="button-container">
    <button onclick="enviarChecklist()">Enviar Checklist</button>
    <button onclick="limparChecklist()">Limpar</button>
  </div>

  <script>
    const checklistItems = [
      "Atender o cliente em até 20 segundos",
      "Dar boas vindas ao cliente usando mensagem padrão",
      "Análise dos registros anteriores",
      "Confirmação positiva do histórico",
      "Analisar o cadastro do cliente",
      "Confirmar endereço do imóvel",
      "Retornar ao cliente em até 2 minutos",
      "Direcionar cliente ao App ou Site quando aplicável",
      "Usar a calculadora da base de conhecimento",
      "Taguear 100% dos contatos",
      "Agradecer e recapitular atendimento",
      "Demonstrar cordialidade e procedimento correto",
      "Atuar em boleto conforme processo",
      "Escolher palavras com acolhimento humano",
      "Registrar no CRM 100% dos contatos",
      "Resumir atendimento e verificar dúvidas",
      "Oferecer pesquisa em 100% dos atendimentos"
    ];

    const checklistContainer = document.getElementById('checklist');

    checklistItems.forEach((item, index) => {
      const div = document.createElement('div');
      div.className = 'item';
      div.innerHTML = `<label><input type="checkbox" id="check${index}"> ${item}</label>`;
      checklistContainer.appendChild(div);
    });

    function limparChecklist() {
      checklistItems.forEach((_, index) => {
        document.getElementById(`check${index}`).checked = false;
      });
    }

    function enviarChecklist() {
      const analista = document.getElementById('analista').value.trim();
      const ticket = document.getElementById('ticket').value.trim();
      const endpoint = 'https://script.google.com/macros/s/AKfycbxI-sEYNww18bpcpFWJR23l7lCW31XSIQ4SV6PXJIEy-gQwTY4N3j3vMAxRgpcwsFk/exec';

      if (!analista || !ticket) {
        alert("Por favor, preencha o nome do analista e o ticket de atendimento.");
        return;
      }

      const respostas = checklistItems.map((_, index) => document.getElementById(`check${index}`).checked);

      const segredo = "chave-super-secreta";
      const token = btoa(segredo + ticket + analista);

      const payload = {
        analista: analista,
        ticket: ticket,
        respostas: respostas,
        token: token
      };

      fetch(endpoint, {
        method: "POST",
        body: JSON.stringify(payload),
        headers: { "Content-Type": "application/json" }
      })
      .then(res => res.json())
      .then(data => {
        if (data.status === 'success' || data.status === 'sucesso') {
          alert("Checklist enviado com sucesso!");
          limparChecklist();
        } else {
          alert("Erro ao enviar: " + data.message);
        }
      })
      .catch(() => {
        alert("Erro de conexão. Verifique a URL do Web App e permissões.");
      });
    }
  </script>
</body>
</html>
